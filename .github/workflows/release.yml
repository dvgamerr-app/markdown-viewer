name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_COLOR: '0'
  NO_COLOR: '1'

jobs:
  build:
    name: Build and Pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      # The committed version is a 0.0 placeholder; the tag is the source of truth.
      - name: Stamp the tag version into the manifests
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] || { echo "tag $TAG is not a Chrome version (1-4 dot separated numbers)"; exit 1; }
          for file in manifest.chrome.json manifest.firefox.json; do
            sed -i -E "s/(\"version\"[[:space:]]*:[[:space:]]*\")[^\"]*\"/\1$version\"/" "$file"
            grep -n '"version"' "$file"
          done
      - name: Unit and integration tests
        run: bun run test:ci
      - name: Pack chrome and firefox
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          bun run build:dist
          cp dist/nimbus-markdown.zip "release/nimbus-markdown-chrome-$TAG.zip"
          bun run build:dist:firefox
          cp dist/nimbus-markdown.zip "release/nimbus-markdown-firefox-$TAG.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nimbus-markdown-${{ github.ref_name }}
          path: release/*.zip
          retention-days: 30
          if-no-files-found: error

  publish:
    name: GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nimbus-markdown-${{ github.ref_name }}
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/*.zip --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
